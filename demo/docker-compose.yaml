# The demo: Traefik with the plugin loaded from this repository's source, in
# front of a "prod" backend (go-httpbin), with a "sut" (whoami) standing in
# for a service under test. From this directory:
#
#   docker compose up -d && ./demo-test.sh
#
#   TRAEFIK_VERSION  the Traefik image tag (default v3.5)
#   DEMO_PORT        the port published on 127.0.0.1 (default 8000)
#   PLUGIN_DIR       where the plugin's source is read from (default: the
#                    repository root)
services:
  traefik:
    image: traefik:${TRAEFIK_VERSION:-v3.5}
    command:
      - '--log.level=INFO'
      - '--accesslog=true'
      - '--entrypoints.web.address=:8000'
      - '--providers.file.filename=/etc/traefik/dynamic.yaml'
      # Yaegi reads the plugin source from ./plugins-local/src/<moduleName>
      # (relative to `/`, the image's working directory); `siding` is the
      # alias dynamic.yaml refers to.
      - '--experimental.localPlugins.siding.moduleName=github.com/rainbowshouse/siding'
    ports:
      # Loopback only.
      - '127.0.0.1:${DEMO_PORT:-8000}:8000'
    volumes:
      # Source, not a build: Yaegi interprets the .go files of this one
      # directory (and skips the _test.go ones).
      - '${PLUGIN_DIR:-..}:/plugins-local/src/github.com/rainbowshouse/siding:ro'
      - './dynamic.yaml:/etc/traefik/dynamic.yaml:ro'
      # The registry is re-read every refreshInterval: edit registry.json
      # while this runs to add or repoint a tenancy.
      - './registry.json:/etc/siding/registry.json:ro'
    depends_on:
      - prod
      - sut

  prod:
    image: mccutchen/go-httpbin:2.25.0

  sut:
    image: traefik/whoami:v1.11.0
